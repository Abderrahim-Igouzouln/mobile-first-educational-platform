name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deveduforge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deveduforge-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          JWT_ACCESS_SECRET: test-access-secret-that-is-at-least-thirty-two-bytes
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-thirty-two-bytes
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deveduforge_test
          NODE_ENV: test

  mobile:
    name: Mobile – lint, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deveduforge-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deveduforge-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
        env:
          EXPO_PUBLIC_API_URL: http://localhost:4000/api/v1
