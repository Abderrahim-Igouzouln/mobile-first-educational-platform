version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deveduforge_test
      POSTGRES_PASSWORD: deveduforge_test
      POSTGRES_DB: deveduforge_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deveduforge_test']
      interval: 5s
      timeout: 3s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
