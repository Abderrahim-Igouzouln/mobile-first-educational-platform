name: Build Unsigned iOS IPA
on: 
  workflow_dispatch:
  push:
    branches:
      - addLessons

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd deveduforge-mobile
          npm install --legacy-peer-deps
          npm install react-native-worklets --legacy-peer-deps

      - name: Expo Prebuild
        run: |
          cd deveduforge-mobile
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd deveduforge-mobile/ios
          pod install

      - name: Build Unsigned App
        run: |
          cd deveduforge-mobile
          xcodebuild -workspace ios/deveduforge.xcworkspace \
            -scheme deveduforge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Package into IPA
        run: |
          cd deveduforge-mobile
          mkdir Payload
          mv ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r deveduforge.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deveduforge-ios-ipa
          path: deveduforge-mobile/deveduforge.ipa
